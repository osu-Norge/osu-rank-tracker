name: Python Linting

on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/PythonLint.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7" # Same as in the Dockerfile
      - name: Install flake8
        run: uv sync --locked --only-dev
      - name: Flake8 Lint
        run: uv run --no-sync flake8 src --max-line-length=120 --show-source
