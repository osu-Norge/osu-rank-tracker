[project]
name = "osu-rank-tracker"
version = "1.0.0"
description = "A Discord bot that keeps track of members' osu! ranks and updates their roles accordingly"
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.*",
    "discord.py==2.7.*",
    "expiringdict==1.2.*",
    "fastapi==0.162.*",
    "iso3166==3.0.*",
    "jinja2==3.1.*",
    "psycopg[binary]==3.3.*",
    "psycopg-pool==3.3.*",
    "pyyaml==6.0.*",
    "psutil==7.2.*",
    "uvicorn==0.54.*",
]

[dependency-groups]
dev = [
    "flake8==7.5.*",
]
